name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test tests/DiskMap.Core.Tests -c Release

      - name: Build app
        run: dotnet build src/DiskMap.App -c Release -p:Platform=x64

      - name: Build tray helper
        run: dotnet build src/DiskMap.Tray -c Release
